spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: lb://ORDER-SERVICE  # load-balanced URI for the order service
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - StripPrefix=2
                - name : LoggingOrderFilter
                - name : Authentication  # or we can also use directly AuthenticationGatewayFilterFactory
                  args :
                    isEnabled : false
            - id: inventory-service
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/api/v1/inventory/**
              filters:
                - StripPrefix=2
                - AddRequestHeader=X-Custom-Header, Chinuthon
                - name: Authentication  #or we can also use directly AuthenticationGatewayFilterFactory

#server configuration
server:
  port: 8080

#eureka client configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/